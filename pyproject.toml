[project]
name = "alf"
version = "0.1.0"
description = "ALF - 私人情感陪伴 agent 小奥, 基于 langgraph + mem0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "mem0ai>=2.0",
    "chromadb>=0.5",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
alf = "alf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"alf.api" = ["static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"
